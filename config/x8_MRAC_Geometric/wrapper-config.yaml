########################################################################################################################
# Wrapper config
#
# Configures "wrapper" mode: running many back-to-back / concurrent simulations
# from a single invocation of scripts/wrapper.py instead of one simulation per
# manual launch.
#
# NOTES:
# - This file is only read by scripts/wrapper.py. The C++ simulator itself only
#   checks mode.enable_wrapper in sim-config.yaml to decide how to lay out its
#   log directory (see ConfigureLogDirectoryWrapperRun in sim-logger.cpp).
# - This file is copied into the shared wrapper log directory
#   (sim-log/<platform>/wrapper/config/) for reproducibility, same as the
#   other config files.
########################################################################################################################

# ============================================================================
# Wrapper Run Settings
# ============================================================================
wrapper:
  # Total number of simulation runs to execute across the whole session.
  total_runs: 100

  # Maximum number of simulations to run concurrently. Runs are launched this
  # many at a time (staggered 1 second apart), and a new run is started as
  # soon as a slot frees up, in a rolling fashion, until total_runs have been
  # completed.
  concurrent_runs: 3
